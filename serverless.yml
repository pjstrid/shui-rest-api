# Your own Serverless org, read from config.yml (not committed - copy config.example.yml).
org: ${file(./config.yml):org}
# Used in the names of the Lambdas and the stack in AWS.
service: shui-rest-api

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}
  environment:
    JWT_SECRET: ${file(./config.yml):jwtSecret}


functions:
  # Auth
  register:
    handler: functions/auth/register/index.handler
    events:
      - httpApi:
          path: /auth/register
          method: POST
  login:
    handler: functions/auth/login/index.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST

  # Posts
  getPosts:
    handler: functions/posts/getPosts/index.handler
    events:
      - httpApi:
          path: /posts
          method: GET
  getPostById:
    handler: functions/posts/getPostById/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: GET
  createPost:
    handler: functions/posts/createPost/index.handler
    events:
      - httpApi:
          path: /posts
          method: POST
  updatePost:
    handler: functions/posts/updatePost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: PUT
  deletePost:
    handler: functions/posts/deletePost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: DELETE

  # Comments (VG)
  getComments:
    handler: functions/comments/getComments/index.handler
    events:
      - httpApi:
          path: /posts/{postId}/comments
          method: GET
  createComment:
    handler: functions/comments/createComment/index.handler
    events:
      - httpApi:
          path: /posts/{postId}/comments
          method: POST

resources:
  Resources:
    ShuiDB:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ShuiDB
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
